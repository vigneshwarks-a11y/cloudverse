[[redirects]]
  from = "/blog/why-cloud-cost-transparency-is-critical-for-executive-decision-making"
  to = "/blog/why-cloud-cost-transparency-is-critical-for-executive-decision-making/index.html"
  status = 200

[[redirects]]
  from = "/solutions"
