[build]
  command = "npm run build"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]

[[edge_functions]]
function = "googlebotBypass"
path = "/resources"

[[edge_functions]]
function = "googlebotBypass"
path = "/resources/*"

[[edge_functions]]
function = "googlebotBypass"
path = "/solutions"

[[edge_functions]]
function = "googlebotBypass"
path = "/solutions/*"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
