[build]
  command = "npm run build"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]

[[edge_functions]]
function = "googlebotBypass"
path = "/resources"

[[edge_functions]]
function = "googlebotBypass"
path = "/resources/*"

[[edge_functions]]
function = "googlebotBypass"
path = "/solutions"

[[edge_functions]]
function = "googlebotBypass"
path = "/solutions/*"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/security"
  to = "/security/index.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing/index.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners/index.html"
  status = 200

[[redirects]]
  from = "/resources"
  to = "/resources/index.html"
  status = 200

[[redirects]]
  from = "/connect"
  to = "/connect/index.html"
  status = 200

[[redirects]]
  from = "/platform"
  to = "/platform/index.html"
  status = 200

[[redirects]]
  from = "/legal/terms"
  to = "/legal/terms/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
